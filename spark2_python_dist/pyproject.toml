[build-system]
# >=64: PEP 660 editable; <80: stays compatible with colcon-core
requires = ["setuptools>=64,<80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spark2_sdk"
version = "1.0.0"
description = "Production Python API for Spark2 SDK"
requires-python = ">=3.8"

[tool.setuptools]
# Tell Python where your source package lives
packages = ["spark2_sdk"]

[tool.setuptools.package-data]
# Native extension + engine lib under lib/<platform>/<toolchain>/
spark2_sdk = ["lib/**/*"]
