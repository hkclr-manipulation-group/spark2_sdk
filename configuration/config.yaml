panel:
  dt_send: 0.04
  dt_receive: 0.01
  dt_heartbeat_ms: 10
  port: 12309  # local UDP bind for core ACKs
  general:
    smoothing_method: Cos
    target_type: Position
    actuator_mode: Velocity
    acc_time: 5
    vel_ratio: 50
rt_control:
  # Aligned with cuarm_configuration/spark2_v2/config.yaml for local same-host debug
  server_ip: 127.0.0.1  # or auto / discover
  core_request_port: 8881
  monitoring_request_port: 8882
  telemetry_port: 9988          # unicast SrvState listen port (matches RT telemetry_port)
  multicast_ip: 224.0.0.123     # kept for SDK auto-discovery probes
  multicast_port: 9988          # legacy alias of telemetry_port
  hardware_simulation: false
  robotics_library: pinocchio
  client_id: 10003 
  keys_path: keys.json
robot:
  name: arm_v2_no_gripper
  urdf: arm_v2.urdf
  arm:
    - name: arm
      type: Spark2_V2
      joint_size: 6
      urdf_joints: ["arm_J1", "arm_J2", "arm_J3", "arm_J4", "arm_J5", "arm_J6"]
      urdf_links: ["arm_L1", "arm_L2", "arm_L3", "arm_L4", "arm_L5", "arm_L6", "arm_end_effector"]
      enable_joint: [true, true, true, true, true, true]
      safety:
        joint_soft_limit:
          position: [[-180.0, -90.0, -180.0, -20.0, -180.0, -360.0], [180.0, 90.0, 180.0, 180.0, 180.0, 360.0]]
          velocity: [300, 300, 300, 300, 300, 300]
          torque: [40, 40, 40, 20, 20, 20]
